<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Ebook Reader</title>
    <!-- 1. Load JSZip first (required for EPUBs) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <!-- 2. Load the EPUB.js library -->
    <script src="https://cdn.jsdelivr.net"></script>
    
    <style>
        #viewer { width: 90%; height: 80vh; margin: 20px auto; border: 1px solid #ccc; background: white; }
        .controls { text-align: center; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="controls">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>

    <script>
        // Wait for the entire page and libraries to finish loading
        window.onload = function() {
            try {
                // Change the filename below to match your file EXACTLY
                var book = ePub("./the-night-of-the-nutcracker.epub"); 
                var rendition = book.renderTo("viewer", {
                    width: "100%",
                    height: "100%",
                    flow: "paginated"
                });

                rendition.display().catch(function(err) {
                    console.error("Error displaying book:", err);
                });

                document.getElementById("next").onclick = function() { rendition.next(); };
                document.getElementById("prev").onclick = function() { rendition.prev(); };
                
            } catch (e) {
                console.error("ePub library still not loaded:", e);
                alert("The reader library failed to load. Please refresh the page.");
            }
        };
    </script>
</body>
</html>
