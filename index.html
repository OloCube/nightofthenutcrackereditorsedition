<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Ebook Reader</title>
    <!-- Essential scripts to read the EPUB format in a browser -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        #viewer { width: 80%; height: 600px; margin: auto; border: 1px solid #ccc; }
        .controls { text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="controls">
        <button id="prev">Previous</button>
        <button id="next">Next</button>
    </div>

    <script>
        // Load the book from your repository
        var book = ePub("your-book-filename.epub");
        var rendition = book.renderTo("viewer", {
            width: "100%",
            height: "100%",
            flow: "paginated"
        });

        var displayed = rendition.display();

        // Navigation buttons
        document.getElementById("next").addEventListener("click", function(){
            rendition.next();
        }, false);

        document.getElementById("prev").addEventListener("click", function(){
            rendition.prev();
        }, false);
    </script>
</body>
</html>
