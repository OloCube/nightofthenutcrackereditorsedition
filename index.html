<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>The Night of the Nutcracker</title>

<!-- JSZip (required for EPUB files) -->

<script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>

<!-- EPUB.js -->

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

#viewer{
  width:100%;
  height:95vh;
}
</style>

</head>

<body>

<div id="viewer"></div>

<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  rendition.display();

};
</script>

</body>
</html>
