<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ebook Reader</title>
    <!-- We use the bundled version that is most compatible with GitHub -->
    <script src="https://cdn.jsdelivr.net"></script>
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f0f0; display: flex; flex-direction: column; align-items: center; }
        #viewer { width: 90vw; height: 80vh; background: white; border: 1px solid #ccc; margin-top: 20px; }
        .controls { margin: 20px; }
        #status-log { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="viewer"></div>
    <div id="status-log">Status: Starting...</div>

    <div class="controls">
        <button onclick="prev()">Back</button>
        <button onclick="next()">Next</button>
    </div>

    <script>
        const log = (msg) => document.getElementById('status-log').innerText = "Status: " + msg;

        async function init() {
            try {
                log("Downloading book data...");
                // MATCH YOUR FILENAME EXACTLY (No spaces, check capitals)
                const response = await fetch("./the-night-of-the-nutcracker.epub");
                
                if (!response.ok) throw new Error("Could not find the file on GitHub.");
                
                const arrayBuffer = await response.arrayBuffer();
                log("Unzipping book...");

                // Initialize with raw data to bypass server MIME type issues
                window.book = ePub(arrayBuffer);
                window.rendition = book.renderTo("viewer", {
                    width: "100%", height: "100%", flow: "paginated"
                });

                log("Rendering pages...");
                await rendition.display();
                log("Ready!");

            } catch (err) {
                log("Error: " + err.message);
                console.error(err);
            }
        }

        function next() { if(rendition) rendition.next(); }
        function prev() { if(rendition) rendition.prev(); }

        window.onload = init;
    </script>
</body>
</html>
