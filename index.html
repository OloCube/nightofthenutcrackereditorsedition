<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>The Night of the Nutcracker</title>

<!-- JSZip (EPUB files are zipped) -->

<script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>

<!-- EPUB.js -->

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

#viewer{
  width:100%;
  height:90vh;
}

#controls{
  text-align:center;
  padding:10px;
  background:#f0f0f0;
}

button{
  padding:10px 20px;
  margin:5px;
  font-size:16px;
  cursor:pointer;
}
</style>

</head>

<body>

<div id="viewer"></div>

<div id="controls">
<button id="prev">Previous</button>
<button id="next">Next</button>
</div>

<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  rendition.display();

  document.getElementById("next").onclick = function() {
    rendition.next();
  };

  document.getElementById("prev").onclick = function() {
    rendition.prev();
  };

};
</script>

</body>
</html>
