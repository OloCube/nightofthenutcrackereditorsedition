<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  const key = "nutcracker-location";

  // open saved location if it exists
  const saved = localStorage.getItem(key);
  rendition.display(saved || undefined);

  // save location whenever the page changes
  rendition.on("relocated", function(location){
    localStorage.setItem(key, location.start.cfi);
  });

  document.getElementById("next").onclick = () => rendition.next();
  document.getElementById("prev").onclick = () => rendition.prev();

};
</script>
