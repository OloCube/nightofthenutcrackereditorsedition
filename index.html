<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Night of the Nutcracker</title>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

#viewer{
  width:100%;
  height:95vh;
  border:1px solid #ccc;
}

#controls{
  text-align:center;
  padding:10px;
}

button{
  padding:10px 20px;
  font-size:16px;
}
</style>

</head>

<body>

<div id="viewer"></div>

<div id="controls">
<button id="prev">Previous</button>
<button id="next">Next</button>
</div>

<script>
var book = ePub("the-night-of-the-nutcracker.epub");

var rendition = book.renderTo("viewer", {
  width: "100%",
  height: "100%",
  flow: "scrolled"
});

rendition.display();

document.getElementById("next").onclick = function() {
  rendition.next();
};

document.getElementById("prev").onclick = function() {
  rendition.prev();
};
</script>

</body>
</html>
