<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ebook Reader</title>
    <!-- Combined reliable scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        #viewer { width: 90vw; height: 80vh; margin: auto; border: 1px solid #ccc; }
        .controls { text-align: center; margin: 20px; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="controls">
        <button onclick="book.package.prev()">Previous</button>
        <button onclick="book.package.next()">Next</button>
    </div>

    <script>
        // This function only runs once the external library IS DEFINED
        function init() {
            if (typeof ePub === 'undefined') {
                setTimeout(init, 500); // Check again in half a second
                return;
            }
            
            // FILENAME MUST BE EXACT: the-night-of-the-nutcracker.epub
            window.book = ePub("./the-night-of-the-nutcracker.epub");
            window.rendition = book.renderTo("viewer", {
                width: "100%", height: "100%", flow: "paginated"
            });
            rendition.display();
        }

        init();
        function next() { rendition.next(); }
        function prev() { rendition.prev(); }
    </script>
</body>
</html>
