<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reader</title>
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #eee; }
        #viewer { width: 90vw; height: 80vh; background: white; margin-top: 20px; border: 1px solid #ccc; }
        .nav { margin: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="nav">
        <button id="prev">Back</button>
        <button id="next">Next</button>
    </div>

    <script>
        async function loadEpub() {
            try {
                // 1. Fetch the file as an ArrayBuffer (raw data) to bypass GitHub MIME issues
                const response = await fetch("./the-night-of-the-nutcracker.epub");
                if (!response.ok) throw new Error("File not found on server");
                const data = await response.arrayBuffer();

                // 2. Initialize the book using the raw data
                const book = ePub(data);
                const rendition = book.renderTo("viewer", {
                    width: "100%", height: "100%", flow: "paginated"
                });

                await rendition.display();

                document.getElementById("next").onclick = () => rendition.next();
                document.getElementById("prev").onclick = () => rendition.prev();
                
                console.log("Book displayed successfully!");
            } catch (err) {
                console.error("Critical Error:", err);
                document.body.innerHTML += `<p style="color:red">Error: ${err.message}</p>`;
            }
        }

        // Wait for libraries, then run
        window.onload = () => {
            if (typeof ePub !== 'undefined') loadEpub();
            else setTimeout(window.onload, 500);
        };
    </script>
</body>
</html>
