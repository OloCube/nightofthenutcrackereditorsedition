<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>The Night of the Nutcracker</title>

<script src="https://cdn.jsdelivr.net/npm/jszip/dist/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
}

#viewer{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100vh;
}

/* navigation buttons */
.nav{
  position:fixed;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  background:rgba(0,0,0,0.4);
  color:white;
  border:none;
  padding:15px 20px;
  cursor:pointer;
}

#prev{
  left:10px;
}

#next{
  right:10px;
}
</style>

</head>

<body>

<div id="viewer"></div>

<button class="nav" id="prev">❮</button> <button class="nav" id="next">❯</button>

<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  rendition.display();

  document.getElementById("next").onclick = () => rendition.next();
  document.getElementById("prev").onclick = () => rendition.prev();
};
</script>

</body>
</html>
