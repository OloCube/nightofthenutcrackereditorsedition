<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ebook Reader</title>
    <!-- One single, highly reliable link that contains everything needed -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
        #viewer { width: 90vw; height: 80vh; background: white; border: 1px solid #ccc; margin-top: 20px; }
        .controls { margin: 20px; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #666; }
    </style>
</head>
<body>

    <div id="loading">Opening Book...</div>
    <div id="viewer"></div>

    <div class="controls">
        <button id="prev">← Previous</button>
        <button id="next">Next →</button>
    </div>

    <script>
        // Check every 100ms if the library is ready
        var checkLibrary = setInterval(function() {
            if (typeof ePub !== 'undefined') {
                clearInterval(checkLibrary);
                document.getElementById('loading').style.display = 'none';
                startBook();
            }
        }, 100);

        function startBook() {
            // MAKE SURE THIS FILENAME MATCHES YOUR GITHUB FILE EXACTLY
            var book = ePub("./the-night-of-the-nutcracker.epub");
            var rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%",
                flow: "paginated",
                manager: "default"
            });

            rendition.display().catch(function(err) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerText = "Error: File not found or blocked.";
            });

            document.getElementById("next").onclick = function() { rendition.next(); };
            document.getElementById("prev").onclick = function() { rendition.prev(); };
        }
    </script>
</body>
</html>
