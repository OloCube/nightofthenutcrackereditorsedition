<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Ebook Reader</title>
    
    <!-- These links pull the "engine" from a reliable source so you don't need the extra files -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <script src="https://cdn.jsdelivr.net"></script>

    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: #f4f4f4; }
        #viewer { width: 90vw; height: 80vh; background: white; border: 1px solid #ccc; margin-top: 20px; }
        .controls { margin: 20px; }
        button { padding: 10px 25px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="viewer"></div>

    <div class="controls">
        <button id="prev">← Previous</button>
        <button id="next">Next →</button>
    </div>

    <script>
        // This waits for the page to load before trying to find your book
        document.addEventListener("DOMContentLoaded", function() {
            // MATCH YOUR FILENAME EXACTLY (Case Sensitive!)
            var book = ePub("./the-night-of-the-nutcracker.epub");
            var rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%",
                flow: "paginated",
                manager: "default"
            });

            var displayed = rendition.display();

            // Button Logic
            document.getElementById("next").addEventListener("click", function(e) {
                rendition.next();
                e.preventDefault();
            }, false);

            document.getElementById("prev").addEventListener("click", function(e) {
                rendition.prev();
                e.preventDefault();
            }, false);
        });
    </script>
</body>
</html>
