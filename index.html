<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  const STORAGE_KEY = "nutcracker-progress";

  // Save location whenever page changes
  rendition.on("relocated", function(location){
    localStorage.setItem(STORAGE_KEY, location.start.cfi);
  });

  // Wait until the book is ready before restoring location
  book.ready.then(function() {

    const savedLocation = localStorage.getItem(STORAGE_KEY);

    if (savedLocation) {
      rendition.display(savedLocation);
    } else {
      rendition.display();
    }

  });

  document.getElementById("next").onclick = () => rendition.next();
  document.getElementById("prev").onclick = () => rendition.prev();

};
</script>
