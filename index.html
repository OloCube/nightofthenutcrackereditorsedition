<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Night of the Nutcracker</title>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

#viewer{
    width:100%;
    height:90vh;
}

#controls{
    text-align:center;
    padding:10px;
    background:#222;
}

button{
    padding:10px 15px;
    margin:5px;
    font-size:16px;
}
</style>
</head>

<body>

<div id="viewer"></div>

<div id="controls">
<button onclick="rendition.prev()">Previous</button>
<button onclick="rendition.next()">Next</button>
</div>

<script>
var book = ePub("the-night-of-the-nutcracker.epub");

var rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
});

rendition.display();
</script>

</body>
</html>
