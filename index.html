<script>
window.onload = function () {

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  // Load saved location
  const savedLocation = localStorage.getItem("nutcracker-progress");

  if (savedLocation) {
    rendition.display(savedLocation);
  } else {
    rendition.display();
  }

  // Save location whenever the reader moves
  rendition.on("relocated", function(location){
    localStorage.setItem("nutcracker-progress", location.start.cfi);
  });

  // Buttons
  document.getElementById("next").onclick = () => rendition.next();
  document.getElementById("prev").onclick = () => rendition.prev();

};
</script>
