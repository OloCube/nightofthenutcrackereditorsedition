<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ebook Reader</title>
    <!-- We use the ALL-IN-ONE version of epub.js that already includes jszip -->
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; background: #fafafa; }
        #viewer { width: 90vw; height: 80vh; background: white; border: 1px solid #ddd; margin-top: 20px; }
        .controls { margin: 20px; display: flex; gap: 15px; }
        button { padding: 10px 25px; font-size: 16px; cursor: pointer; border-radius: 4px; border: 1px solid #007bff; background: #007bff; color: white; }
    </style>
</head>
<body>
    <div id="viewer"></div>
    <div class="controls">
        <button onclick="prev()">Previous</button>
        <button onclick="next()">Next</button>
    </div>

    <script>
        var book, rendition;

        function loadBook() {
            // We use 'window.ePub' to ensure the browser finds the tool
            if (typeof window.ePub !== 'function') {
                console.log("Waiting for library...");
                setTimeout(loadBook, 500); // Retry every half second
                return;
            }

            // USE YOUR FILENAME EXACTLY (No spaces!)
            book = window.ePub("./the-night-of-the-nutcracker.epub");
            rendition = book.renderTo("viewer", {
                width: "100%",
                height: "100%",
                flow: "paginated",
                manager: "default"
            });

            rendition.display().catch(err => {
                console.error("Reader Error:", err);
                document.getElementById('viewer').innerHTML = "<p style='padding:20px'>Error: Could not load the book file. Check the filename!</p>";
            });
        }

        function next() { rendition.next(); }
        function prev() { rendition.prev(); }

        window.onload = loadBook;
    </script>
</body>
</html>
