<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<title>The Night of the Nutcracker</title>

<script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<style>
body {
  margin:0;
  font-family:Arial, sans-serif;
}

#viewer {
  height:90vh;
  width:100%;
}

#status {
  padding:10px;
  background:#eee;
}
</style>

</head>

<body>

<div id="status">Loading book...</div>
<div id="viewer"></div>

<script>
window.onload = function () {

  const status = document.getElementById("status");

  const book = ePub("the-night-of-the-nutcracker.epub");

  const rendition = book.renderTo("viewer", {
    width: "100%",
    height: "100%"
  });

  rendition.display().then(() => {
    status.innerText = "Book loaded.";
  }).catch(err => {
    status.innerText = "Error loading book: " + err;
  });

};
</script>

</body>
</html>
